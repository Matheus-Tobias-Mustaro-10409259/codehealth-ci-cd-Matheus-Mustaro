name: CodeHealth CI/CD Pipeline

on:
  push:
    branches:
      - develop

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Etapa de build
        run: |
          echo "Iniciando build da aplicação CodeHealth..."
          python -m py_compile main.py
          echo "Build finalizado com sucesso."

      - name: Etapa de testes
        run: |
          echo "Executando testes automatizados..."
          python main.py
          echo "Testes executados com sucesso."

      - name: Relatório do pipeline
        if: success()
        run: echo "Build successful"

      - name: Relatório de falha
        if: failure()
        run: echo "Test failed"

      - name: Criar pasta de homologação
        if: success()
        run: |
          mkdir -p staging
          cp main.py staging/
          echo "Arquivo copiado para ambiente de homologação."

      - name: Gerar artefato ZIP
        if: success()
        run: |
          zip -r codehealth-staging.zip staging/
          echo "Artefato de deploy gerado com sucesso."

      - name: Upload do artefato
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: codehealth-staging
          path: codehealth-staging.zip
